<!doctype html>
<!-- Breach Team 3D in the browser (Unity WebGL template). Full-window canvas, a loading bar in the web game's
     colours, and a way back to the 2D web game. Built by BuildPlayer.WebGL into breach-team/play/. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breach Team 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; color: #d7e3ee; font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #0b0f14; outline: none; }
    #load { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; background: #0b0f14; }
    #load h1 { margin: 0; font: 700 34px/1 Rajdhani, system-ui, sans-serif; letter-spacing: .08em; color: #ffb02e; }
    #load .sub { color: #8197ab; font-size: 14px; }
    #bar { width: min(420px, 80vw); height: 8px; border: 1px solid #24364a; border-radius: 6px; background: #121a23; overflow: hidden; }
    #fill { height: 100%; width: 0; background: linear-gradient(90deg, #ffb02e, #3dd6ff); transition: width .2s; }
    #load a, #warn a { color: #3dd6ff; }
    #warn { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); max-width: 92vw; padding: 8px 14px; border: 1px solid #24364a; border-radius: 8px; background: #121a23; font-size: 13px; display: none; z-index: 2; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="load">
    <h1>BREACH TEAM 3D</h1>
    <div id="bar"><div id="fill"></div></div>
    <div class="sub" id="status">Downloading the game… (the first visit is the big one; after that it loads from cache)</div>
    <div class="sub">Same account and save as the <a href="../">web game</a>. Best on a desktop browser.</div>
  </div>
  <div id="warn"></div>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const warn = (msg) => { const w = document.querySelector('#warn'); w.innerHTML = msg; w.style.display = 'block'; };
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))
      warn('Breach Team 3D is made for desktop browsers. On a phone, the <a href="../">web game</a> plays better.');
    const config = {
      dataUrl: 'Build/WebGL.data.unityweb',
      frameworkUrl: 'Build/WebGL.framework.js.unityweb',
      codeUrl: 'Build/WebGL.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Deck of Many Things",
      productName: "Breach Team",
      productVersion: "0.23.1",
      showBanner: (msg, type) => { if (type === 'error') warn(msg); else console.warn(msg); },
    };
    const script = document.createElement('script');
    script.src = 'Build/WebGL.loader.js';
    script.onload = () => {
      createUnityInstance(canvas, config, (p) => {
        document.querySelector('#fill').style.width = (100 * p) + '%';
        if (p >= 0.9) document.querySelector('#status').textContent = 'Starting up…';
      }).then(() => {
        document.querySelector('#load').remove();
        canvas.focus();
      }).catch((e) => {
        document.querySelector('#status').innerHTML = 'Couldn\'t start the 3D client: ' + e + '<br>Your browser may not support WebGL 2. The <a href="../">web game</a> works everywhere.';
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
