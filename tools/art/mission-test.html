<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mission render test</title>
<link rel="stylesheet" href="../../css/style.css">
<script type="importmap">{"imports":{"pixi.js":"https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.mjs"}}</script></head>
<body><main id="panel"></main><div id="modal" hidden></div><div id="toast" hidden></div>
<script type="module">
// Local render test: runs a mission with the shared rules (no account, nothing saved) and plays it.
// ?ship=raider&entry=shuttle&tactic=blitz&level=9   (secret ships work here too, e.g. ?ship=secret_horseshoe)
import * as R from '../../js/game/rules.js';
import { simulate } from '../../js/engine/battle.js';
import { rollAftermath } from '../../js/engine/aftermath.js';
import { SHIP_BY_ID } from '../../js/data/ships.js';
import { ENGINE_VERSION } from '../../js/data/version.js';
import { playMission } from '../../js/app/mission.js';
const q = new URLSearchParams(location.search);
const g = R.newGame();
const level = +(q.get('level') || 1);
for (const s of g.soldiers) s.level = level;
g.soldiers[0].colors = ['#3a5a8c', '#f2c14e']; g.soldiers[1].colors = ['#c0392b', '#e0e0e0']; g.soldiers[2].colors = ['#5a3a7a', '#7fd1ff']; g.soldiers[3].colors = ['#e8e8e8', '#ff4f6d'];
const shipId = q.get('ship') || 'raider';
const input = { engineVersion: ENGINE_VERSION, seed: +(q.get('seed') || 12345), ship: shipId, entry: q.get('entry') || 'shuttle', tactic: q.get('tactic') || 'balanced', retreat: q.get('retreat') || 'teleport_recall', squad: g.soldiers.map(s => R.engineSoldier(g, s)) };
const battle = simulate(input);
const report = R.applyMission(g, input, battle, rollAftermath(battle, input.squad), SHIP_BY_ID[shipId].name);
if (q.get('defend')) { const d = R.runDefense(g, { threat: q.get('defend'), power: +(q.get('power') || 100) }, input.seed + 1); if (d) report.defense = d.report; }   // ?defend=pirate_raid&power=100
if (SHIP_BY_ID[shipId].secret) { report.secret = true; report.plannedShip = 'hauler'; report.firstContact = true; }
playMission(document.getElementById('panel'), battle, report, report.colors, true);
</script></body></html>
